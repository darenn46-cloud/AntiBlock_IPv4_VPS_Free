# Hysteria 2 Server Configuration Template
listen: :20443

tls:
  cert: /etc/hysteria/server.crt
  key: /etc/hysteria/server.key

auth:
  type: http
  http:
    url: http://127.0.0.1:2054/api/auth

trafficStats:
  listen: 127.0.0.1:9999
  secret: change_this_stats_secret

masquerade:
  type: proxy
  proxy:
    url: https://bing.com
    rewriteHost: true

outbounds:
  - name: default
    type: direct
